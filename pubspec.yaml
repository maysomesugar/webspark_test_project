name: webspark_test_project
description: "Webspark test project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  go_router: ^18.1.4
  get_it: ^9.3.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.12.0
  flutter_gen_runner:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_gen:
  line_length: 80

flutter_intl:
  enabled: true
  arb_dir: lib/core/localization/l10n
  output_dir: lib/core/localization/generated